spring.application.name=TaskflowBackend

server.port=${SERVER_PORT:8080}

# Comma-separated frontend origins. Add the deployed frontend URL through
# APP_CORS_ALLOWED_ORIGINS; never use a wildcard with authenticated APIs.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/taskflow_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Development defaults. For production, apply versioned DB migrations first,
# then set JPA_DDL_AUTO=validate. Keep SQL logging disabled by default.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}
spring.jpa.open-in-view=false

# ==========================================
# JWT CONFIGURATION
# ==========================================

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ==========================================
# EMAIL CONFIGURATION
# ==========================================

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ==========================================
# TASK REMINDER SCHEDULER
# ==========================================

# Scheduler checks each minute and evaluates each account's saved time zone/time.

# Frontend URL used in reminder emails
app.frontend.url=${APP_FRONTEND_URL:http://localhost:5173}